name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked pytest -q
      - run: uv run --locked ruff check src tests scripts
      - run: uv run scripts/check_docs.py
      - run: uv build
      - run: uv run --locked scripts/smoke_package.py dist/rctl-0.2.1-py3-none-any.whl
